<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>展柜环境风险巡检</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>展柜环境风险巡检工作台</h1><section class="panel"><h2>建立巡检批次</h2><form method="post" action="/inspection"><label>批次标题<input name="title" required></label><label>展柜编号（逗号分隔）<input name="showcase_ids" required placeholder="A-01,A-02"></label><label>责任人<input name="collector" required></label><label>材质<select name="material"><option>通用</option><option>纸质</option><option>纺织</option><option>金属</option><option>陶瓷</option></select></label><label>采集开始<input type="datetime-local" name="window_start" required></label><label>采集结束<input type="datetime-local" name="window_end" required></label><button>创建批次</button></form></section><section><h2>批次列表</h2><table><tr><th>标题</th><th>状态</th><th>风险</th><th>责任人</th><th>操作</th></tr>{{range .Batches}}<tr><td>{{.Title}}</td><td>{{.Status}}</td><td class="risk-{{.RiskLevel}}">{{.RiskLevel}}</td><td>{{.Collector}}</td><td><a href="/inspection/{{.ID}}">查看详情</a></td></tr>{{else}}<tr><td colspan="5">暂无批次，请先建立巡检。</td></tr>{{end}}</table></section></main></body></html>
